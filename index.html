<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!--
      Marks that scripting is available, BEFORE first paint. Entry and scroll
      animations hide their elements via `.js [data-reveal] { opacity: 0 }`, so
      without this class nothing is ever hidden: a visitor with JavaScript off,
      blocked, or simply slow to load sees the prerendered content immediately
      rather than a blank page. Inline and synchronous on purpose — a deferred
      or external script would paint the unstyled state first.
    -->
    <script>
      (function () {
        var d = document.documentElement
        d.classList.add('js')
        // Dead-man's switch: if the app has not signalled that it mounted
        // within 4s — a chunk 404s, a script error, an ad blocker eats the
        // bundle — drop the class so the reveal styles stop hiding content and
        // the prerendered page is simply readable. Cleared in src/main.jsx.
        window.__thkReveal = setTimeout(function () { d.classList.remove('js') }, 4000)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      ============================================================
      IMPORTANT: these static tags are what social platforms read.
      ============================================================
      WhatsApp, Facebook and Telegram crawlers do NOT execute JavaScript, so the
      per-page <Seo> component (react-helmet-async) is invisible to them — only
      what is literally in this file produces a link preview. That makes this
      block the source of truth for shared links.

      The image below MUST be an absolute https:// URL. Relative paths silently
      produce a preview with no image, which is what the old build did: it
      pointed at /og-image.jpg, a file that was never created.
    -->
