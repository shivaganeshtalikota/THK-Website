    <!--
      Marks that scripting is available, BEFORE first paint. Entry and scroll
      animations hide their elements via `.js [data-reveal] { opacity: 0 }`, so
      without this class nothing is ever hidden: a visitor with JavaScript off,
      blocked, or simply slow to load sees the prerendered content immediately
      rather than a blank page. Inline and synchronous on purpose — a deferred
      or external script would paint the unstyled state first.
    -->
    <script>
      (function () {
        var d = document.documentElement
        d.classList.add('js')
        // Dead-man's switch: if the app has not signalled that it mounted
        // within 4s — a chunk 404s, a script error, an ad blocker eats the
        // bundle — drop the class so the reveal styles stop hiding content and
        // the prerendered page is simply readable. Cleared in src/main.jsx.
        window.__thkReveal = setTimeout(function () { d.classList.remove('js') }, 4000)
      })()
    </script>

    <!--
      Icons.

      The ?v=2 is a cache buster, and it is load-bearing. These files shipped for
      a while behind `Cache-Control: immutable, max-age=31536000` because a
      blanket rule for png/jpg/ico caught them, and immutable means the browser
      is entitled never to ask again — so the favicon changed on the server and
      no existing visitor ever saw it. vercel.json no longer marks these
      immutable, but that only helps future changes: a browser already holding
      the year-long entry will not revalidate. A different URL is the only thing
      that reaches it. Bump the number whenever the icon artwork changes.
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!--
      Fonts are self-hosted from /fonts (generated by scripts/fetch-fonts.py).

      They used to load from Google's CDN with the usual deferred-stylesheet
      trick: media="print" onload="this.media='all'". That onload is an inline
      event handler, and the production CSP is `script-src 'self'` with no
      'unsafe-inline' — Chrome blocked the handler, the sheet stayed at
      media="print", and EVERY webfont on the site silently fell back to
      Georgia and system-ui. It only broke in production because localhost
      never applies vercel.json's headers.

      Self-hosting removes the cause: no inline handler to block, no
      third-party DNS + TLS in the critical path, no visitor IPs sent to a
      third party, and a CSP that needs no font or style exceptions at all.

      crossorigin is required on the preloads even though these are
      same-origin: fonts are always fetched in CORS mode, and without it the
      preload is discarded and the file is downloaded a second time.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-800-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-600-latin.woff2" crossorigin />
